name: Update PDM dependencies
on:
  workflow_call:
    inputs:
      pdm_args:
        description: Arguments to pass to pdm
        type: string
        default: -u --save-compatible --no-sync --no-self
  workflow_dispatch:
    inputs:
      pdm_args:
        description: Arguments to pass to pdm
        type: string
        default: -u --save-compatible --no-sync --no-self
  schedule:
    - cron: '0 8 * * 3'   # every Wednesday at 08:00 UTC

permissions:
  contents: read
  pull-requests: read

jobs:
  update:
    name: 👛 Update with PDM
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating PRs
      pull-requests: write  # Required for creating PRs
    steps:
      - name: 📰 Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: dev

      - name: 📦 Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: 3.x
          cache: true

      - name: 👚 Update to latest compatible versions
        run: |
          pdm update ${{ inputs.pdm_args || '-u --save-compatible --no-sync --no-self' }}

      - name: 📝 Create pull request
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7
        with:
          branch: update-dependencies-${{ github.run_number }}
          title: 🤖 Update dependencies
          body: |
            This PR updates dependencies to their latest compatible versions.
            This PR was created by the PDM Update Bot.
          sign-commits: true
          add-paths: pyproject.toml,pdm.lock
          commit-message: 🤖 Update dependencies
          labels: maintenance 🔧
          draft: false
          base: dev
          reviewers: djpetti,HashedViking,LearningCircuit
